// MeshPigeon radio interface — device-level messages.
//
// Part of the authoritative wire specification for the MeshPigeon radio
// firmware (see envelope.proto for framing and the evolution policy).
//
// Semantics for every message in this file are normative in
// docs/radio-protocol.md: defaults, atomicity, capability rejection,
// the PIN/auth model, and the factory-reset scope.

syntax = "proto3";

package meshpigeon;

option csharp_namespace = "MeshPigeon.Protos";
option go_package = "github.com/meshpigeon/meshpigeon-firmware/protobufs/meshpigeon";
option java_multiple_files = true;
option java_package = "dev.meshpigeon.proto";
option swift_prefix = "";

// ---------------------------------------------------------------------------
// Device info
// ---------------------------------------------------------------------------

// Requests the device's identity, version and health. Always allowed, even
// when a PIN is set and the client has not authenticated (the lock screen
// needs it to know to ask for a PIN).
message GetDeviceInfo {}

// The response to GetDeviceInfo: identity, versions, capabilities, store
// statistics and health (docs/radio-protocol.md §5).
message DeviceInfo {
  // Version of this specification the firmware was built against. Additive
  // proto changes do NOT bump it; whole-spec breaks do. Clients must refuse
  // radios whose spec_version they do not implement.
  uint32 spec_version = 1;

  // Firmware version string, e.g. "0.2.0".
  string fw_version = 2;

  // Board name, e.g. "XIAO WIO", "HELTEC V3", "T114", "T1000-E", "SIM".
  string board_name = 3;

  // What this board can do. Clients treat unknown values as "ignore this
  // entry" — the same skip-unknown rule as fields — and rely on
  // ERROR_CODE_NOT_SUPPORTED rejections as the backstop, so new capabilities
  // are purely additive and never exhaust a bitmask. See the Capability enum
  // for defined values.
  repeated Capability capabilities = 4;

  // Monotonic 64-bit uptime in milliseconds: the 32-bit millis() counter
  // plus a RAM rollover count, so it effectively never wraps (uint64 ms =
  // ~584 million years). Clients pair this with app time once per
  // connection; packets carry the same clock, so every timestamp is plain
  // arithmetic — no rollover/boot reasoning on the client side. A reboot
  // legitimately restarts it (and empties the RAM packet store).
  uint64 uptime_ms = 5;

  // Increments on each real boot; persisted (NVS key on ESP32, a file on
  // nRF52). Purely informational now that uptime never wraps — useful
  // diagnostics ("how many power cycles has this radio seen?"). It plays
  // no role in timestamping.
  uint32 boot_count = 6;

  // Packet store statistics (the RAM ring — packets are never persisted).
  StoreInfo store = 7;

  // Bumped by the firmware on every accepted radio-settings change.
  uint32 radio_config_epoch = 8;

  // Battery millivolts; 0xFFFF = unknown.
  uint32 battery_mv = 9;

  // False = radio init failed; the device still answers (report the fault).
  bool radio_ok = 10;

  // True = this client may not use the node yet. False while the device
  // still holds the public default PIN "0000" (which is what ships, so a
  // client can always read this field to find that out), and false on a
  // connection that has authenticated since. Every operation except
  // ping / get_device_info / get_status / auth answers
  // ERROR_CODE_AUTH_REQUIRED while this is true.
  bool auth_required = 11;

  // Estimated receiver noise floor in dBm, from the most recent packet the
  // radio heard (RSSI - SNR); 0 = unknown, i.e. nothing received since
  // boot. A reading, not a mesh statistic: the app pairs it with the
  // per-packet RSSI/SNR it already sees to judge how quiet the band is.
  // It changes only when a packet arrives, so poll it, do not expect
  // updates.
  int32 noise_floor_dbm = 12;
}

// Packet store statistics. The store is RAM-only by design (docs/radio-protocol.md §10):
// capacity is a byte budget, entries are variable-length, and everything here
// describes the volatile ring — a reboot legitimately clears it.
message StoreInfo {
  // Packets currently retained.
  uint32 count = 1;

  // Byte budget of the ring (packet capacity depends on packet sizes).
  uint32 capacity_bytes = 2;

  // Packets evicted by overflow (or dropped for exceeding the whole budget).
  // Survives PurgeStore — it counts overflow, not history — but, like the
  // rest of the store, it is per boot.
  uint32 dropped = 3;

  // First retained seq — the *gap boundary*: anything below it has been
  // evicted and can never be fetched again, so a client compares against it
  // to notice a gap. It is NOT a cursor to start from: FetchPackets.since_seq
  // is exclusive, so starting there would skip the oldest entry still held
  // (use since_seq = 0 for "everything"). Monotonic within a boot; restarts
  // after a reboot (the store is RAM-only).
  uint32 oldest_seq = 4;
}

// Board capabilities, reported in DeviceInfo. Add a value when a board
// gains an ability; clients compiled against older schemas skip values they
// do not know. Values are stable — never renumber or reuse.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // Can join a Wi-Fi network as a station.
  CAPABILITY_WIFI_STA = 1;
  // battery_mv is meaningful (not always 0xFFFF).
  CAPABILITY_BATTERY = 2;
  // Has the BLE NUS transport.
  CAPABILITY_BLE = 3;
  // Has the USB CDC transport.
  CAPABILITY_USB_CDC = 4;
}

// ---------------------------------------------------------------------------
// Device settings
// ---------------------------------------------------------------------------

// Reads the device settings. Requires auth (the Wi-Fi password is in here).
// The PIN itself is write-only on the wire: no read model carries it, so a
// client can neither see the current PIN nor learn whether it is still the
// shipped default — it remembers what it set.
message GetDeviceSettings {}

// The device settings, as stored (the read model). A response to
// GetDeviceSettings or SetDeviceSettings, and the payload of the async
// "another client changed settings" push (this same message, id = 0).
message DeviceSettings {
  // Effective device/advertised name. Empty stored name is reported as the
  // derived default ("MeshPigeon-XXXX" from the MAC), so this is never empty
  // in a response.
  string name = 1;

  bool wifi_enabled = 2;

  // Station SSID; empty when Wi-Fi is not configured.
  string wifi_ssid = 3;

  // WPA2/3 passphrase; empty when not configured.
  string wifi_password = 4;

  // TCP server port (default 5000).
  uint32 wifi_port = 5;
}

// Writes a SUBSET of the device settings: fields left unset are unchanged.
// Applied atomically (docs/radio-protocol.md §8.1) — one invalid or capability-gated field
// rejects the whole request with nothing applied. Persists immediately and
// applies live; the response carries the full post-write DeviceSettings, and
// other connected clients receive an async DeviceSettingsChanged.
message SetDeviceSettings {
  // 0..20 bytes, no control characters (the name is advertised verbatim
  // over BLE, a length-constrained UTF-8 field). Empty string resets to the
  // derived default name. Bytes >= 0x80 are allowed, so non-ASCII names work.
  optional string name = 1;

  // 4..8 ASCII digits. The device ALWAYS has a PIN: it ships with the
  // public default "0000" (knowable without any documentation, like every
  // Bluetooth device's default); setting a value here replaces it. There is
  // no "no PIN" state. Empty string restores the default; absent =
  // unchanged. A successful write authorizes THIS connection (it proved it
  // knows the new PIN by writing it) and de-authorizes every other one.
  optional string pin = 2;

  optional bool wifi_enabled = 3;

  // <= 32 bytes. Empty string clears the SSID.
  optional string wifi_ssid = 4;

  // <= 63 bytes (WPA2/3 limit). Empty string clears the password.
  optional string wifi_password = 5;

  // Non-zero; 5000 by default.
  optional uint32 wifi_port = 6;
}

// ---------------------------------------------------------------------------
// Status
// ---------------------------------------------------------------------------

// Reads connection status. Allowed on every transport, auth or not — this is
// how a client on BLE learns what the Wi-Fi is doing.
message GetStatus {}

message Status {
  enum WifiState {
    WIFI_STATE_UNSPECIFIED = 0;
    // Disabled, unconfigured, or the board has no Wi-Fi at all.
    WIFI_STATE_OFF = 1;
    WIFI_STATE_CONNECTING = 2;
    WIFI_STATE_CONNECTED = 3;
    // The AP rejected the credentials; retrying with backoff.
    WIFI_STATE_AUTH_FAIL = 4;
    // No AP found or driver error; retrying with backoff.
    WIFI_STATE_ERROR = 5;
  }

  WifiState wifi_state = 1;

  // Currently associated SSID; empty when not connected. This is what the
  // driver latched onto, which is not always what is configured —
  // GetDeviceSettings reports the configured one.
  string wifi_ssid = 2;

  // Station IPv4 address in network byte order, 4 bytes; zeroed when not
  // connected.
  bytes wifi_ipv4 = 3;

  // Configured TCP port (0 on boards with no Wi-Fi). The listener only runs
  // while associated, so this is the port to dial, not a promise that
  // something is currently listening.
  uint32 wifi_port = 4;

  // AP signal in dBm; 0 = unknown. Changes are NOT pushed — poll if wanted.
  int32 wifi_rssi = 5;

  // Connected BLE centrals.
  uint32 ble_clients = 6;

  // USB CDC hosts with the port open (0 or 1): the serial console.
  uint32 usb_cdc_clients = 7;

  // TCP sockets the Wi-Fi server currently has open (ESP32 boards only).
  uint32 wifi_tcp_clients = 8;
}

// ---------------------------------------------------------------------------
// Access control and power ops
// ---------------------------------------------------------------------------

// Authenticates this connection. Required (when a PIN is set) before any
// operation other than ping / get_device_info / get_status / auth. Three
// failures trigger a 1 s delay per further attempt.
message Auth {
  // 4..8 ASCII digits.
  string pin = 1;
}

// Clean restart into the persisted configuration.
message Reboot {}

// Wipes device settings to defaults AND clears the packet store (the RAM
// ring), then reboots: "as it shipped". Requires auth when a PIN is set.
message FactoryReset {}

// Reboots into bootloader/DFU for in-app flashing. Requires auth when a PIN
// is set.
// NOTE: the firmware today performs a plain restart, not a real ROM/DFU
// entry — the board-specific entry sequence is still to come.
message Bootloader {}
