// MeshPigeon radio interface — radio tuning and the packet store.
//
// Part of the authoritative wire specification for the MeshPigeon radio
// firmware (see envelope.proto for framing and the evolution policy).
//
// Semantics are normative in docs/radio-protocol.md: the first-owner lock
// (§6.1), the raw-bytes-only store, and the RAM-only guarantee (§10 — no
// packet bytes are ever written to flash).

syntax = "proto3";

package meshpigeon;

option csharp_namespace = "MeshPigeon.Protos";
option go_package = "github.com/meshpigeon/meshpigeon-firmware/protobufs/meshpigeon";
option java_multiple_files = true;
option java_package = "dev.meshpigeon.proto";
option swift_prefix = "";

// ---------------------------------------------------------------------------
// Radio tuning
// ---------------------------------------------------------------------------

// Reads the persisted radio settings.
message GetRadioSettings {}

// The LoRa radio tuning: frequency, bandwidth, spreading factor, coding rate
// and TX power. A response to GetRadioSettings or SetRadioSettings
// (post-bump), and the payload of the async "another client re-tuned" push
// (this same message, id = 0).
message RadioSettings {
  // Center frequency in Hz.
  uint32 freq_hz = 1;

  // Channel bandwidth in Hz (e.g. 125000 = 125.00 kHz).
  uint32 bandwidth_hz = 2;

  // Spreading factor, 5..12.
  uint32 sf = 3;

  // Coding rate denominator: 5..8 means 4/5 .. 4/8.
  uint32 cr = 4;

  // TX power in dBm, 0..22 (the SX1262/LR1110 ceiling; anything above is
  // rejected rather than truncated).
  uint32 power_dbm = 5;

  // Bumped by the firmware (+1) on every accepted change; ignored in
  // SetRadioSettings requests. Lets clients detect concurrent retunes.
  uint32 config_epoch = 6;
}

// Applies new radio settings atomically: validated, persisted immediately,
// applied at once, and every OTHER *authorized* connected client receives an
// async RadioSettings (this message, id = 0) — the re-tune push asks the
// same is_authorized() question its request does, because the read model it
// carries is auth-gated. During the first 5 minutes after boot only the
// FIRST accepted change is honored; later ones return ERROR_CODE_BUSY (the
// first-owner lock, docs/radio-protocol.md §6.1), as does a retune attempted
// while a transmission is still keying up.
message SetRadioSettings {
  // `optional` for the same reason every SetDeviceSettings field is: an
  // absent submessage and an all-defaults one encode and decode identically
  // otherwise, and only has_settings tells them apart. Without it there is
  // no way to answer BAD_PAYLOAD for a request that carried no settings.
  optional RadioSettings settings = 1;
}

// ---------------------------------------------------------------------------
// Packet store
// ---------------------------------------------------------------------------

// Sends raw on-air bytes once (≤ 255 bytes — the Semtech SX12xx silicon cap,
// which covers everything MeshCore and Meshtastic can put on the air).
// No retry/ACK logic lives here — the app owns that and listens for on-air
// ACKs through the same store. One TX at a time: a second concurrent send
// returns ERROR_CODE_BUSY. The async TxResult for the returned seq follows
// when the radio finishes.
message SendPacket {
  bytes raw = 1;
}

// Acknowledges a SendPacket: the packet was stored and keyed up; seq is the
// store id the eventual TxResult refers to.
message PacketAccepted {
  uint32 seq = 1;
}

// Streams retained packets: all entries with seq > since_seq, oldest first,
// up to max_count, one PacketEntry per COBS frame (each echoing the request's
// id), terminated by a FetchEnd carrying the delivered count.
message FetchPackets {
  // Resume cursor: only entries with seq > since_seq are sent, so the
  // cursor is the last seq you received. 0 means "from the beginning" and
  // stays valid for the life of the boot, since seq 0 is never assigned —
  // do NOT start from StoreInfo.oldest_seq, which is the gap boundary and
  // would skip the oldest entry still held.
  uint32 since_seq = 1;

  // Upper bound on entries delivered in this stream. 0 means "no bound",
  // the same convention since_seq = 0 uses: 0 is not a meaningful bound, and
  // a client asking for "all of them" would otherwise get an empty FetchEnd
  // and read it as an empty store. Any non-zero value is clamped to the
  // per-request cap (the firmware streams straight out of the sink, and a
  // board must stay responsive), so FetchEnd.count may come back smaller
  // than asked for: re-issue with since_seq = the last seq you received.
  uint32 max_count = 2;
}

// One retained packet: raw on-air bytes plus reception metadata. The firmware
// cannot read the payload — raw is all it keeps (that is what maximizes
// capacity, docs/radio-protocol.md §10). Pushed live to every *authorized*
// client, exactly like the gated FetchPackets it mirrors.
message PacketEntry {
  // Monotonic store id; never reused across wraps or purges.
  uint32 seq = 1;

  // Raw over-the-air bytes, ≤ 255.
  bytes raw = 2;

  // Radio uptime at rx/tx time — the same monotonic 64-bit clock as
  // DeviceInfo.uptime_ms. Anchor once per connection and every packet
  // places with plain arithmetic.
  uint64 uptime_ms = 3;

  // RF stats at rx time (0 for TX entries).
  int32 rssi = 4;

  // RF stats at rx time (0 for TX entries).
  int32 snr = 5;

  // Where this entry came from. Entries are exactly one of these; new
  // origins may be added later, so treat unknown values as "display with
  // the default treatment" rather than an error.
  enum Origin {
    ORIGIN_UNSPECIFIED = 0;
    // Keyed up by us via SendPacket.
    ORIGIN_SENT = 1;
    // Received off the air.
    ORIGIN_RECEIVED = 2;
  }

  Origin origin = 6;
}

// Terminates a FetchPackets stream: the number of PacketEntry frames
// delivered (which may be fewer than max_count).
message FetchEnd {
  uint32 count = 1;
}

// Outcome of a SendPacket, pushed asynchronously (id = 0) when the radio
// finishes keying up — including when it refused the send outright, in which
// case the PacketAccepted still goes out first: the app holds that seq in its
// outbox and has to be told the outcome either way. A packet the radio could
// never accept (radio_ok false) is the one case with no PacketAccepted, and
// so no TxResult: that one answers ERROR_CODE_NO_RADIO instead.
message TxResult {
  // The store id returned in PacketAccepted.
  uint32 seq = 1;

  // True = transmitted; false = the radio failed to complete it.
  bool success = 2;
}

// Wipes the packet store (the RAM ring). Settings are untouched; FactoryReset
// is the one that clears both. Sequence numbers do NOT restart: they are
// monotonic for the life of the boot, so a cursor stays valid. Clients
// re-baseline from StoreInfo.oldest_seq.
message PurgeStore {}
